name: Build apps (Windows · Android · iOS)

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: "앱이 접속할 taest 서버 주소 (예: https://taest.info). 비워 두면 앱 첫 실행 시 입력합니다."
        required: false
        type: string
        default: ""
      targets:
        description: "빌드할 앱"
        required: true
        type: choice
        options:
          - all
          - windows
          - android
          - ios
        default: all
  push:
    tags:
      - "app-v*"

permissions:
  contents: read

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.12.3"

jobs:
  windows:
    name: Windows (.exe)
    if: ${{ github.event_name == 'push' || inputs.targets == 'all' || inputs.targets == 'windows' }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 기본 서버 주소 기록
        shell: pwsh
        run: |
          $url = "${{ inputs.web_url }}".Trim()
          if ($url -eq "") {
            '{"webUrl":""}' | Set-Content -Encoding utf8NoBOM apps/desktop/default-url.json
            Write-Host "기본 주소 없음: 앱 첫 실행 시 설정 화면에서 입력합니다."
          } else {
            if ($url -notmatch '^https?://') { throw "web_url 은 http(s):// 로 시작해야 합니다: $url" }
            @{ webUrl = $url.TrimEnd('/') } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM apps/desktop/default-url.json
            Write-Host "기본 주소: $url"
          }

      - name: 데스크톱 빌드 (타입체크 + 컴파일)
        working-directory: apps/desktop
        run: |
          pnpm typecheck
          pnpm build

      - name: NSIS 설치파일 · Portable 패키징
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win --config electron-builder.yml --publish never

      - name: 산출물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: taest-windows
          path: |
            apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android (.apk)
    if: ${{ github.event_name == 'push' || inputs.targets == 'all' || inputs.targets == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: JDK 21 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK 준비
        uses: android-actions/setup-android@v3

      - name: Android SDK 라이선스 동의
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: SDK 플랫폼 설치 (compileSdk 36)
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 웹 자산 준비 (기본 서버 주소 주입)
        working-directory: apps/mobile
        env:
          TAE_SAAS_WEB_URL: ${{ inputs.web_url }}
        run: pnpm build

      - name: Capacitor 동기화
        working-directory: apps/mobile
        run: npx cap sync android

      - name: Gradle 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/android/**/*.gradle', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: APK 빌드 (debug + release unsigned)
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: 산출물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: taest-android
          path: |
            apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS (unsigned archive)
    if: ${{ github.event_name == 'push' || inputs.targets == 'all' || inputs.targets == 'ios' }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Xcode 확인
        run: xcodebuild -version

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 웹 자산 준비 (기본 서버 주소 주입)
        working-directory: apps/mobile
        env:
          TAE_SAAS_WEB_URL: ${{ inputs.web_url }}
        run: pnpm build

      - name: Capacitor 동기화
        working-directory: apps/mobile
        run: npx cap sync ios

      - name: Swift Package 의존성 해석
        working-directory: apps/mobile/ios/App
        run: xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App

      - name: 서명 없는 아카이브 빌드
        working-directory: apps/mobile/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/taest-ios.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean archive

      - name: 서명 안내
        run: |
          {
            echo "### iOS 서명 없는 아카이브가 만들어졌습니다"
            echo ""
            echo "- 이 아카이브는 App Store 업로드용으로 서명되지 않았습니다. 실기기 설치·배포에는 macOS + Xcode, Apple Developer Program 멤버십, 배포 인증서·프로비저닝 프로파일이 필요합니다."
            echo "- 절차는 \`docs/APPS.md\`의 'iOS 실기기·앱스토어 배포'를 참고하세요."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 산출물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: taest-ios-unsigned
          path: ${{ runner.temp }}/taest-ios.xcarchive
          if-no-files-found: error
          retention-days: 30
