<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <title>연결 실패 · taest</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
        background: radial-gradient(120% 80% at 10% 0%, #eef2ff, #ffffff 55%);
        color: #0f172a;
        font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        text-align: center;
      }
      .mark {
        width: 68px;
        height: 68px;
        margin: 0 auto 16px;
        border-radius: 18px;
        background: linear-gradient(135deg, #6366f1, #4338ca);
        color: #fff;
        font-size: 36px;
        font-weight: 900;
        display: grid;
        place-items: center;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        color: #475569;
        font-size: 14px;
        line-height: 1.6;
        margin: 0 0 22px;
      }
      a {
        display: inline-block;
        width: 100%;
        max-width: 320px;
        padding: 14px 18px;
        border-radius: 12px;
        background: #4f46e5;
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">t</div>
      <h1>서버에 연결할 수 없습니다</h1>
      <p>저장된 주소가 잠시 응답하지 않습니다.<br />주소를 다시 확인해 주세요.</p>
      <a href="index.html?setup=1">설정 화면 열기</a>
    </main>
  </body>
</html>
