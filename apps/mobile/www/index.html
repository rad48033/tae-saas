<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="format-detection" content="telephone=no" />
    <title>taest</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <style>
      :root {
        color-scheme: light;
        --brand: #4f46e5;
        --brand-dark: #4338ca;
        --ink: #0f172a;
        --muted: #475569;
        --line: #e2e8f0;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        min-height: 100dvh;
        font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI",
          sans-serif;
        color: var(--ink);
        background: radial-gradient(120% 80% at 10% 0%, #eef2ff 0%, #ffffff 52%);
        display: flex;
        flex-direction: column;
        padding: calc(20px + var(--safe-top)) 20px calc(20px + var(--safe-bottom));
      }
      .hidden {
        display: none !important;
      }

      /* 스플래시(연결 확인) */
      #splash {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        text-align: center;
      }
      .mark {
        width: 76px;
        height: 76px;
        border-radius: 20px;
        background: linear-gradient(135deg, #6366f1, #4338ca);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 40px;
        font-weight: 900;
        box-shadow: 0 18px 36px -18px rgba(67, 56, 202, 0.75);
      }
      #splash .name {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      #splash .target {
        font-size: 13px;
        color: #94a3b8;
        word-break: break-all;
      }
      .spinner {
        width: 22px;
        height: 22px;
        border-radius: 999px;
        border: 2.5px solid #c7d2fe;
        border-top-color: var(--brand);
        animation: spin 0.8s linear infinite;
        margin-top: 6px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .splash-actions {
        margin-top: 18px;
      }

      /* 설정 화면 */
      #setup {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        width: 100%;
        max-width: 460px;
        margin: 0 auto;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 18px;
      }
      .brand .badge {
        width: 40px;
        height: 40px;
        border-radius: 11px;
        background: linear-gradient(135deg, #6366f1, #4338ca);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 22px;
        font-weight: 900;
      }
      .brand strong {
        font-size: 18px;
        letter-spacing: -0.02em;
      }
      h1 {
        font-size: 23px;
        line-height: 1.3;
        letter-spacing: -0.03em;
        margin: 0 0 8px;
      }
      .lead {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.65;
      }
      .banner {
        display: none;
        margin-bottom: 14px;
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 13px;
        line-height: 1.5;
        background: #fef2f2;
        color: #991b1b;
        border: 1px solid #fecaca;
      }
      .banner[data-visible="true"] {
        display: block;
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 700;
        color: #334155;
        margin-bottom: 6px;
      }
      input[type="url"] {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
        font-size: 16px; /* iOS 자동 확대 방지 */
        color: var(--ink);
        background: #fff;
        outline: none;
      }
      input[type="url"]:focus {
        border-color: #a5b4fc;
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.16);
      }
      button {
        font: inherit;
        border-radius: 12px;
        padding: 15px 18px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
      }
      .primary {
        width: 100%;
        margin-top: 14px;
        border: 0;
        background: var(--brand);
        color: #fff;
        font-size: 15px;
        font-weight: 700;
      }
      .primary:active:not(:disabled) {
        background: var(--brand-dark);
      }
      .secondary {
        width: 100%;
        margin-top: 8px;
        border: 1px solid var(--line);
        background: #fff;
        color: #334155;
        font-size: 14px;
        font-weight: 600;
      }
      .secondary:active:not(:disabled) {
        background: #f8fafc;
      }
      .status {
        min-height: 20px;
        margin: 12px 0 0;
        font-size: 13px;
        line-height: 1.5;
        color: var(--muted);
      }
      .status[data-tone="ok"] {
        color: #047857;
      }
      .status[data-tone="error"] {
        color: #b91c1c;
      }
      .footer {
        margin-top: 22px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        color: #94a3b8;
      }
      .linkish {
        border: 0;
        background: none;
        color: #94a3b8;
        font-size: 12px;
        text-decoration: underline;
        padding: 6px;
      }
    </style>
  </head>
  <body>
    <section id="splash" aria-live="polite">
      <div class="mark" aria-hidden="true">t</div>
      <div class="name">taest</div>
      <div class="spinner" aria-hidden="true"></div>
      <div class="status" id="splash-status">연결을 확인하는 중…</div>
      <div class="target" id="splash-target"></div>
      <div class="splash-actions">
        <button class="linkish" id="splash-cancel" type="button">설정 변경</button>
      </div>
    </section>

    <section id="setup" class="hidden">
      <div class="brand">
        <span class="badge" aria-hidden="true">t</span>
        <strong>taest</strong>
      </div>
      <h1>taest 서버에<br />연결합니다</h1>
      <p class="lead">
        이 앱은 taest 웹 서비스를 휴대폰 앱처럼 쓰기 위한 껍데기입니다. 배포한 서버 주소를 입력하면 앱 안에서 서비스가
        열립니다.
      </p>

      <div class="banner" id="banner" role="alert"></div>

      <form id="setup-form" novalidate>
        <label for="server-url">서버 주소</label>
        <input
          id="server-url"
          name="serverUrl"
          type="url"
          inputmode="url"
          autocomplete="url"
          autocapitalize="off"
          spellcheck="false"
          placeholder="https://taest.info"
        />
        <button class="primary" id="open" type="submit">taest 열기</button>
        <button class="secondary" id="test" type="button">연결 확인</button>
      </form>

      <p class="status" id="status" aria-live="polite"></p>

      <div class="footer">
        <span>주소는 이 기기에만 저장됩니다</span>
        <button class="linkish" id="forget" type="button">주소 지우기</button>
      </div>
    </section>

    <script src="default-config.js"></script>
    <script src="url.js"></script>
    <script>
      (function () {
        var STORAGE_KEY = "taest.serverUrl";
        var params = new URLSearchParams(location.search);
        var splash = document.getElementById("splash");
        var setup = document.getElementById("setup");
        var splashStatus = document.getElementById("splash-status");
        var splashTarget = document.getElementById("splash-target");
        var input = document.getElementById("server-url");
        var banner = document.getElementById("banner");
        var status = document.getElementById("status");
        var openButton = document.getElementById("open");
        var testButton = document.getElementById("test");
        var forgetButton = document.getElementById("forget");
        var cancelButton = document.getElementById("splash-cancel");

        function storedUrl() {
          try {
            return window.localStorage.getItem(STORAGE_KEY) || "";
          } catch (error) {
            return "";
          }
        }

        function rememberUrl(value) {
          try {
            window.localStorage.setItem(STORAGE_KEY, value);
          } catch (error) {
            /* 저장 공간이 없어도 이번 실행은 계속합니다. */
          }
        }

        function defaultUrl() {
          return typeof window.TAEST_DEFAULT_URL === "string" ? window.TAEST_DEFAULT_URL.trim() : "";
        }

        function setStatus(element, message, tone) {
          element.textContent = message || "";
          if (tone) element.dataset.tone = tone;
          else delete element.dataset.tone;
        }

        function showBanner(message) {
          if (!message) {
            banner.dataset.visible = "false";
            banner.textContent = "";
            return;
          }
          banner.textContent = message;
          banner.dataset.visible = "true";
        }

        function setBusy(busy) {
          openButton.disabled = busy;
          testButton.disabled = busy;
          forgetButton.disabled = busy;
          openButton.textContent = busy ? "확인하는 중…" : "taest 열기";
        }

        function showSplash(url) {
          setup.classList.add("hidden");
          splash.classList.remove("hidden");
          splashTarget.textContent = url;
        }

        function showSetup(error, value) {
          splash.classList.add("hidden");
          setup.classList.remove("hidden");
          input.value = value == null ? storedUrl() || defaultUrl() : value;
          showBanner(error || null);
          setStatus(status, "", null);
          setTimeout(function () {
            input.focus();
            input.select();
          }, 60);
        }

        /** CORS 없이도 서버 도달 여부만 확인합니다(opaque 응답 = 살아 있음). */
        function reachable(target) {
          return new Promise(function (resolve) {
            var controller = new AbortController();
            var timer = setTimeout(function () {
              controller.abort();
            }, 6000);
            fetch(target + "/api/health", { mode: "no-cors", cache: "no-store", signal: controller.signal })
              .then(function () {
                resolve(true);
              })
              .catch(function () {
                resolve(false);
              })
              .then(function () {
                clearTimeout(timer);
              });
          });
        }

        async function connect(rawValue, save) {
          var checked = window.TaestUrl.normalizeServerUrl(rawValue);
          if (!checked.ok) {
            showSetup(checked.error, rawValue);
            return;
          }
          if (save) rememberUrl(checked.url);
          showSplash(checked.url);
          var ok = await reachable(checked.url);
          if (ok) {
            location.replace(checked.url);
            return;
          }
          showSetup("서버에 연결할 수 없습니다. 주소를 확인하거나 잠시 후 다시 시도해 주세요.", checked.url);
        }

        async function boot() {
          var forceSetup = params.get("setup") === "1";
          var candidate = storedUrl() || defaultUrl();

          if (forceSetup || !candidate) {
            showSetup(null, candidate);
            return;
          }

          var checked = window.TaestUrl.normalizeServerUrl(candidate);
          if (!checked.ok) {
            showSetup(checked.error, candidate);
            return;
          }

          showSplash(checked.url);
          var ok = await reachable(checked.url);
          if (ok) {
            location.replace(checked.url);
            return;
          }
          showSetup("저장된 주소에 연결할 수 없습니다. 다른 주소를 입력해 주세요.", checked.url);
        }

        document.getElementById("setup-form").addEventListener("submit", function (event) {
          event.preventDefault();
          showBanner(null);
          setBusy(true);
          connect(input.value, true).finally(function () {
            setBusy(false);
          });
        });

        testButton.addEventListener("click", async function () {
          showBanner(null);
          var checked = window.TaestUrl.normalizeServerUrl(input.value);
          if (!checked.ok) {
            setStatus(status, checked.error, "error");
            return;
          }
          setBusy(true);
          setStatus(status, "응답을 기다리는 중…", null);
          var ok = await reachable(checked.url);
          setBusy(false);
          setStatus(status, ok ? "서버가 응답했습니다. ‘taest 열기’를 눌러 주세요." : "서버에 연결할 수 없습니다.", ok ? "ok" : "error");
        });

        forgetButton.addEventListener("click", function () {
          try {
            window.localStorage.removeItem(STORAGE_KEY);
          } catch (error) {
            /* 무시 */
          }
          input.value = defaultUrl();
          showBanner(null);
          setStatus(status, "저장된 주소를 지웠습니다.", null);
        });

        cancelButton.addEventListener("click", function () {
          showSetup(null, splashTarget.textContent || storedUrl());
        });

        if (!window.TaestUrl) {
          showSetup("앱 자산을 읽지 못했습니다. 앱을 다시 설치해 주세요.", "");
          return;
        }

        boot();
      })();
    </script>
  </body>
</html>
