<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="robots" content="noindex" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>오프라인 · taest</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
        background: radial-gradient(circle at 20% 0%, #eef2ff 0%, #ffffff 55%);
        color: #0f172a;
        font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI",
          sans-serif;
        line-height: 1.6;
      }
      main {
        width: 100%;
        max-width: 420px;
        text-align: center;
      }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 16px;
        background: linear-gradient(135deg, #6366f1, #4338ca);
        display: grid;
        place-items: center;
        color: #fff;
        font-size: 32px;
        font-weight: 900;
        box-shadow: 0 12px 32px -12px rgba(67, 56, 202, 0.6);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 24px;
        color: #475569;
        font-size: 14px;
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 12px;
        padding: 14px 18px;
        background: #4f46e5;
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        background: #4338ca;
      }
      .hint {
        margin-top: 16px;
        font-size: 12px;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">t</div>
      <h1>인터넷 연결을 확인해 주세요</h1>
      <p>
        taest는 변환을 위해 서버와 통신합니다.<br />
        연결이 돌아오면 다시 시도해 주세요.
      </p>
      <button type="button" onclick="location.reload()">다시 시도</button>
      <p class="hint">이 화면은 앱에 저장되어 있어 오프라인에서도 열립니다.</p>
    </main>
  </body>
</html>
